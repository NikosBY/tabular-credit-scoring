[project]
name = "tabular-credit-scoring"
version = "0.1.0"
description = "Production-grade credit risk scoring: XGBoost, calibration, SHAP, FastAPI"
requires-python = ">=3.12"
dependencies = [
    "xgboost",
    "scikit-learn",
    "pandas",
    "numpy",
    "shap",
    "mlflow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "gradio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabularcreditscoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
